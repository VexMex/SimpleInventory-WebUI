{% extends "base.html" %}
{% block title %}{{ t('Anmeldung') }} — SimpleInventory{% endblock %}
{% block content %}<section class="panel login"><p class="eyebrow">SimpleInventory</p><h1>{{ t('Anmeldung') }}</h1>
{% if error %}<p class="notice error" role="alert">{{ t(error) }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ t('Passwort') }} <input type="password" name="password" required autocomplete="current-password" maxlength="1024"></label>
<button type="submit">{{ t('Anmelden') }}</button></form></section>{% endblock %}
