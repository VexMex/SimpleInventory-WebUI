# Installation-wide defaults. No credentials belong in this file.
# Restart simpleinventory-web.service after changes.
[display]
language = auto
currency = EUR
theme = auto
accent = teal
density = comfortable

[access]
# Enabling authentication requires locally configured credentials in web.env.
# SIW_AUTH_ENABLED and SIW_LOCAL_BYPASS in web.env override these defaults.
enabled = false
local_bypass = true
